services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - fastapi-task
    depends_on:
      migrations:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  outbox_worker:
    build: .
    command: python -m src.infra.outbox
    env_file:
      - .env
    networks:
      - fastapi-task
    depends_on:
      app:
        condition: service_started

  consumer_worker:
    build: .
    command: python -m src.infra.messaging
    env_file:
      - .env
    networks:
      - fastapi-task
    depends_on:
      app:
        condition: service_started

  migrations:
    build: .
    command: alembic upgrade head
    env_file:
      - .env
    networks:
      - fastapi-task
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4.0-management-alpine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - RABBITMQ_DEFAULT_USER=${BROKER_USER}
      - RABBITMQ_DEFAULT_PASS=${BROKER_PASSWORD}
    volumes:
      - fastapi_task_broker_data:/var/lib/rabbitmq
    networks:
      - fastapi-task
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1gb

  postgres:
    image: postgres:16
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_DB=${DATABASE_DATABASE}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
    volumes:
      - fastapi_task_db_data:/var/lib/postgresql/data/
    networks:
      - fastapi-task
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_DATABASE}" ]
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  fastapi_task_broker_data:
  fastapi_task_db_data:

networks:
  fastapi-task:
